  # ── STOCK ───────────────────────────────────────────────────────────────────
  /api/stock/allocation:
    patch:
      tags: [Stock]
      summary: Set Total allocation for central or sub-warehouse — SUPER_ADMIN only
      description: |
        Changes the **Total** reference number for a warehouse — the baseline used
        to calculate scarcity percentage and display progress bars.
 
        **Does NOT change Remaining** — only the Total allocation reference.
 
        Use when a formal capacity decision changes:
        - New donor agreement increases a district's kit quota
        - Phase planning sets a new allocation target
        - Seed data had an error and needs correcting
 
        | Field | Changes | Use case |
        |---|---|---|
        | Total | ✅ This endpoint | Formal allocation change |
        | Remaining | ❌ Not this endpoint | Use replenish / adjust / dispatch |
 
        **target values:**
        - `central` — updates Central Warehouse Total
        - `subWarehouse` — updates a specific sub-warehouse Stock Total (requires `subWarehouseId`)
 
        **Warning:** If new Total is less than current Remaining, the warehouse will
        show as "above allocation" (↑ EXTRA badge) until stock is consumed or adjusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAllocationRequest'
            examples:
              setCentralEMK1:
                summary: Set Central Warehouse EMK1 allocation to 8,000
                value:
                  target: "central"
                  emkType: "EMK1"
                  newTotal: 8000
                  reason: "New UNICEF agreement increases central EMK1 capacity to 8,000 units"
              setSubWarehouseEMK2:
                summary: Set District 1 sub-warehouse EMK2 allocation to 2,000
                value:
                  target: "subWarehouse"
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK2"
                  newTotal: 2000
                  reason: "Phase 2 plan increases District 1 EMK2 allocation based on updated vulnerability assessment"
              correctSeedError:
                summary: Correct a seed allocation error
                value:
                  target: "subWarehouse"
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK3"
                  newTotal: 500
                  reason: "Seed data set EMK3 total to 0 — correcting to 500 per MoH cold storage transfer agreement"
      responses:
        "200":
          description: Allocation updated — returns target, emkType, newTotal, and updated stock
          content:
            application/json:
              schema:
                type: object
                properties:
                  target:
                    type: string
                    enum: [central, subWarehouse]
                  subWarehouseId:
                    type: string
                    nullable: true
                  emkType:
                    type: string
                    enum: [EMK1, EMK2, EMK3]
                  newTotal:
                    type: integer
                  reason:
                    type: string
                  updatedStock:
                    oneOf:
                      - $ref: '#/components/schemas/StockLevel'
                      - type: object
                        description: Central warehouse stock totals
                        properties:
                          emk1Total: { type: integer }
                          emk1Remaining: { type: integer }
                          emk2Total: { type: integer }
                          emk2Remaining: { type: integer }
                          emk3Total: { type: integer }
                          emk3Remaining: { type: integer }
        "400":
          description: Missing fields, invalid target, or stock record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN

  /api/stock/status:
    get:
      tags: [Stock]
      summary: Stock levels across all sub-warehouses
      description: |
        Returns current EMK levels for all 3 sub-warehouses with scarcity flags.

        **Scarcity rule (Section C.9):** `anyScarce = true` when any EMK type
        remaining falls below 30% of its total allocation.

        **EMK-3 note:** `emk3Total` and `emk3Remaining` will be 0 until the
        Emergency Coordinator triggers a MoH transfer at flood activation (Section B.10).
      responses:
        "200":
          description: All stock levels with scarcity indicators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockLevel'
        "401":
          description: Unauthorized

  /api/stock/central:
    get:
      tags: [Stock]
      summary: Central warehouse stock levels
      description: |
        Returns current EMK levels at the central warehouse.
        
        **Total** = cumulative stock ever received (set at seed, increases only on replenishment).
        **Remaining** = what is currently available to dispatch to sub-warehouses.
        
        Each dispatch reduces Remaining. Each replenishment increases both Total and Remaining.
        Manual adjustments change only Remaining (correction for damage/loss).
        
        **Role:** Any authenticated user can view. Replenish and adjust require SUPER_ADMIN.
      responses:
        "200":
          description: Central warehouse stock with scarcity flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentralStockLevel'
        "500":
          description: Central warehouse not initialised — run seed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
 
  /api/stock/central/replenish:
    post:
      tags: [Stock]
      summary: Replenish central warehouse — new stock arriving — SUPER_ADMIN only
      description: |
        Records new stock physically arriving at the central warehouse
        (donor shipment, MoH delivery, Red Cross HQ transfer).
        
        **Increases both Total and Remaining** — this represents net new stock
        entering the system. Use this when a shipment arrives.
        
        **Do NOT use this for corrections** — use PATCH /api/stock/central for that.
        
        | Operation | Total | Remaining | When to use |
        |---|---|---|---|
        | Replenish | ✅ Increases | ✅ Increases | New stock arrives |
        | Adjust | ❌ No change | ✅ Changes | Correction for damage/loss |
        | Dispatch | ❌ No change | ✅ Decreases (central) | Send to sub-warehouse |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplenishCentralRequest'
            examples:
              donorShipment:
                summary: UNICEF donation of 1,000 EMK-1 kits
                value:
                  emkType: "EMK1"
                  quantity: 1000
                  reason: "UNICEF donation batch 3 — arrived central warehouse 15 May 2026"
              mohTransfer:
                summary: MoH transfers EMK-3 cold storage kits at activation
                value:
                  emkType: "EMK3"
                  quantity: 500
                  reason: "MoH cold storage transfer — flood activation Phase 1 order #4521"
              resupply:
                summary: Red Cross HQ resupply during active flood
                value:
                  emkType: "EMK2"
                  quantity: 300
                  reason: "Red Cross HQ emergency resupply — Phase 2 demand exceeded forecast"
      responses:
        "200":
          description: Replenishment recorded — returns EMK type, quantity, and updated stock totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishCentralResponse'
        "400":
          description: Invalid input or negative quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN
 
  /api/stock/central/adjust:
    patch:
      tags: [Stock]
      summary: Manual correction at central warehouse — SUPER_ADMIN only
      description: |
        Signed quantity correction at the central warehouse.
        Positive = add remaining, negative = remove remaining.
        
        **Does NOT change Total** — only Remaining is adjusted.
        Use this for: damaged kits, miscounts, expired stock removal.
        Use POST /api/stock/central/replenish for new stock arriving.
        
        Will fail if adjustment would result in negative remaining stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustCentralRequest'
            examples:
              removeDamaged:
                summary: Remove 10 water-damaged EMK-2 kits
                value:
                  emkType: "EMK2"
                  quantity: -10
                  reason: "10 EMK-2 kits water-damaged in central storage — removed from manifest"
              correctCount:
                summary: Correct a counting error (add back)
                value:
                  emkType: "EMK1"
                  quantity: 50
                  reason: "Counting error corrected — 50 EMK-1 kits found in secondary storage bay"
      responses:
        "200":
          description: Adjustment recorded — returns updated stock totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishCentralResponse'
        "422":
          description: Adjustment would result in negative stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid input or zero quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN


  /api/stock/movements:
    get:
      tags: [Stock]
      summary: Full audit log of all stock changes
      description: |
        Returns every stock change across all sub-warehouses, newest first.

        **Movement types:**
        - `DISPATCH` — central warehouse → sub-warehouse
        - `MOH_TRANSFER` — MoH cold storage → sub-warehouse (EMK-3 only, auto-set)
        - `REALLOCATION` — cross-district transfer (two records per event: one negative, one positive)
        - `DELIVERY` — sub-warehouse → household (negative quantity, set in Chat 6)
        - `ADJUSTMENT` — manual correction with reason (positive or negative)
      responses:
        "200":
          description: Full stock movement audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovement'
        "401":
          description: Unauthorized

  /api/stock/movements/{districtId}:
    get:
      tags: [Stock]
      summary: Audit log for one district
      parameters:
        - in: path
          name: districtId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District stock movement audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovement'
        "404":
          description: District not found
        "401":
          description: Unauthorized

  /api/stock/dispatch:
    post:
      tags: [Stock]
      summary: Record dispatch from central warehouse to sub-warehouse
      description: |
        Records EMK stock arriving at a sub-warehouse from the central warehouse.
        Increases both `*Total` and `*Remaining` — sets new baseline for scarcity calculation.

        **EMK-3 special rule (Section B.10):** When `emkType` is `EMK3`, the movement
        type is automatically recorded as `MOH_TRANSFER` — EMK-3 only ever comes from
        MoH cold storage. Only Emergency Coordinator or above should dispatch EMK-3.

        **Test sequence:**
        1. `GET /api/districts` — copy a sub-warehouse ID
        2. `GET /api/stock/status` — note current EMK1 levels
        3. `POST /api/stock/dispatch` with EMK1 → emk1Remaining increases
        4. `GET /api/stock/movements` → verify DISPATCH record created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subWarehouseId, emkType, quantity]
              properties:
                subWarehouseId:
                  type: string
                  description: "Get from GET /api/districts response"
                emkType:
                  type: string
                  enum: [EMK1, EMK2, EMK3]
                quantity:
                  type: integer
                  minimum: 1
                reason:
                  type: string
            examples:
              dispatchEMK1:
                summary: Dispatch 200 EMK-1 kits to sub-warehouse 1
                value:
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK1"
                  quantity: 200
                  reason: "Phase 1 resupply — central warehouse dispatch"
              mohTransferEMK3:
                summary: MoH transfers 100 EMK-3 cold kits (flood activation)
                value:
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK3"
                  quantity: 100
                  reason: "MoH cold storage transfer — flood activation Phase 1"
      responses:
        "200":
          description: Dispatch recorded — returns updated stock + movement record
          content:
            application/json:
              schema:
                type: object
                properties:
                  stock:
                    $ref: '#/components/schemas/StockLevel'
                  movement:
                    $ref: '#/components/schemas/StockMovement'
        "400":
          description: Validation error or negative quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

  /api/stock/reallocate:
    post:
      tags: [Stock]
      summary: Cross-district reallocation — Emergency Coordinator only
      description: |
        Moves stock between sub-warehouses. Creates two movement records:
        one with negative quantity at the source, one with positive at the destination.

        **Section A.3:** The Emergency Coordinator makes reallocation decisions
        based on the first demand report at Hours 16–24.

        Will fail if source sub-warehouse has insufficient remaining stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromSubWarehouseId, toSubWarehouseId, emkType, quantity]
              properties:
                fromSubWarehouseId:
                  type: string
                toSubWarehouseId:
                  type: string
                emkType:
                  type: string
                  enum: [EMK1, EMK2, EMK3]
                quantity:
                  type: integer
                  minimum: 1
                reason:
                  type: string
            examples:
              reallocateEMK1:
                summary: Move 300 EMK-1 from District 1 to District 2
                value:
                  fromSubWarehouseId: "REPLACE_WITH_SW1_ID"
                  toSubWarehouseId: "REPLACE_WITH_SW2_ID"
                  emkType: "EMK1"
                  quantity: 300
                  reason: "District 2 demand higher than forecast — Hour 20 reallocation"
      responses:
        "200":
          description: Reallocation recorded — returns updated from and to stock levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    $ref: '#/components/schemas/StockLevel'
                  to:
                    $ref: '#/components/schemas/StockLevel'
        "400":
          description: Insufficient stock, same warehouse, or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires EMERGENCY_COORDINATOR or above

  /api/stock/adjust:
    post:
      tags: [Stock]
      summary: Manual stock adjustment with reason — Hub Manager or above
      description: |
        Positive quantity = add stock. Negative quantity = remove stock.
        `reason` field is mandatory — this is an audit trail requirement.

        Use cases: damaged items removed, expired items disposed of,
        counting error corrected, items found in back storage.

        Will fail if adjustment would result in negative remaining stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subWarehouseId, emkType, quantity, reason]
              properties:
                subWarehouseId:
                  type: string
                emkType:
                  type: string
                  enum: [EMK1, EMK2, EMK3]
                quantity:
                  type: integer
                  description: "Positive = add stock, negative = remove stock"
                reason:
                  type: string
                  description: "Mandatory — logged in audit trail"
            examples:
              removeExpired:
                summary: Remove 5 water-damaged EMK-2 kits
                value:
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK2"
                  quantity: -5
                  reason: "5 kits water-damaged on arrival — rejected per B.7 integrity check"
              addFoundStock:
                summary: Add 10 EMK-1 kits found in storage
                value:
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK1"
                  quantity: 10
                  reason: "10 kits found in back storage during count — added to manifest"
              testScarcity:
                summary: "Test scarcity trigger — reduce EMK1 below 30% threshold"
                value:
                  subWarehouseId: "REPLACE_WITH_SUBWAREHOUSE_ID"
                  emkType: "EMK1"
                  quantity: -5000
                  reason: "Testing scarcity mode trigger (dev only)"
      responses:
        "200":
          description: Adjustment recorded — returns updated stock + movement record
          content:
            application/json:
              schema:
                type: object
                properties:
                  stock:
                    $ref: '#/components/schemas/StockLevel'
                  movement:
                    $ref: '#/components/schemas/StockMovement'
        "400":
          description: Negative stock result, zero quantity, or missing reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires HUB_MANAGER or above

  /api/stock/{districtId}:
    get:
      tags: [Stock]
      summary: Stock for one district
      parameters:
        - in: path
          name: districtId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: District stock level with scarcity flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevel'
        "404":
          description: District or sub-warehouse not found
        "401":
          description: Unauthorized

  # ── DELIVERY ────────────────────────────────────────────────────────────────
  /api/delivery/runs:
    post:
      tags: [Delivery]
      summary: Start a delivery run
      description: |
        Creates a new delivery run for a team departing a sub-warehouse.
        Records departure time automatically.

        **Section B.5 delivery run structure:**
        - 3 teams of 4 volunteers per sub-warehouse
        - teamNumber: 1, 2, or 3
        - zone: pre-mapped ward boundary (e.g. "Zone A", "Ward 3")
        - leadVolunteerId: must exist in volunteers table

        **Test sequence:**
        1. `GET /api/volunteers?districtId=X` to find a volunteer ID
        2. `GET /api/districts` to get subWarehouseId
        3. Start run → copy run ID for receipt tests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subWarehouseId, teamNumber, zone, leadVolunteerId]
              properties:
                subWarehouseId:
                  type: string
                  description: "Get from GET /api/districts"
                teamNumber:
                  type: integer
                  enum: [1, 2, 3]
                  description: "Section B.4: 3 teams per sub-warehouse"
                zone:
                  type: string
                  example: "Zone A"
                  description: "Pre-mapped ward boundary"
                leadVolunteerId:
                  type: string
                  description: "Must exist in volunteers table"
            examples:
              team1ZoneA:
                summary: "Team 1 departing District 1 Sub-Warehouse for Zone A"
                value:
                  subWarehouseId: "REPLACE_WITH_SW_ID"
                  teamNumber: 1
                  zone: "Zone A"
                  leadVolunteerId: "REPLACE_WITH_VOLUNTEER_ID"
      responses:
        "201":
          description: Delivery run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRun'
        "400":
          description: Validation error or sub-warehouse/volunteer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

    get:
      tags: [Delivery]
      summary: List all delivery runs (filter by district or status)
      parameters:
        - in: query
          name: districtId
          schema:
            type: string
          description: Filter runs by district
        - in: query
          name: status
          schema:
            type: string
            enum: [IN_PROGRESS, COMPLETE, ABORTED]
          description: Filter by run status
      responses:
        "200":
          description: List of delivery runs newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryRun'
        "401":
          description: Unauthorized

  /api/delivery/receipts:
    post:
      tags: [Delivery]
      summary: Record per-household delivery confirmation (decrements stock)
      description: |
        Records that a specific household received an EMK.

        **Two things happen atomically:**
        1. `DeliveryReceipt` record created
        2. Sub-warehouse stock decremented via `recordDelivery()` in stock.service
        3. Household marked as `delivered: true`

        **Validation:**
        - Run must be IN_PROGRESS
        - Household must not already be marked delivered
        - Sub-warehouse must have sufficient remaining stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryRunId, householdId, emkType, deliveredAt]
              properties:
                deliveryRunId:
                  type: string
                  description: "Must be an IN_PROGRESS run"
                householdId:
                  type: string
                  description: "Must not already be delivered"
                emkType:
                  type: string
                  enum: [EMK1, EMK2, EMK3]
                quantity:
                  type: integer
                  default: 1
                  minimum: 1
                deliveredAt:
                  type: string
                  format: date-time
                  example: "2026-04-21T09:30:00Z"
                notes:
                  type: string
                  description: "Optional — volunteer field notes"
            examples:
              emk1Delivery:
                summary: "Deliver EMK-1 to a general household"
                value:
                  deliveryRunId: "REPLACE_WITH_RUN_ID"
                  householdId: "REPLACE_WITH_HOUSEHOLD_ID"
                  emkType: "EMK1"
                  quantity: 1
                  deliveredAt: "2026-04-21T09:30:00Z"
                  notes: "Household confirmed. Elderly resident answered door."
      responses:
        "201":
          description: Receipt recorded and stock decremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryReceipt'
        "400":
          description: Run not in progress, household already delivered, or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

  /api/delivery/runs/{id}:
    get:
      tags: [Delivery]
      summary: Single run with all receipts and household details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery run with full receipt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRun'
        "404":
          description: Run not found
        "401":
          description: Unauthorized

  /api/delivery/runs/{id}/complete:
    patch:
      tags: [Delivery]
      summary: Mark run complete — team has returned to sub-warehouse
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run completed with return time recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRun'
        "400":
          description: Run already complete or aborted
        "401":
          description: Unauthorized

  /api/delivery/runs/{id}/abort:
    patch:
      tags: [Delivery]
      summary: Abort run — volunteer safety (Hub Manager only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Run aborted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRun'
        "400":
          description: Run not in progress
        "401":
          description: Unauthorized
        "403":
          description: Requires HUB_MANAGER or above

  # ── ROUTING ─────────────────────────────────────────────────────────────────
  /api/route/recommend:
    get:
      summary: Recommend delivery mode
      tags: [Routes]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: districtId
          schema:
            type: string
          description: District ID - returns per-zone breakdown (primary use)
        - in: query
          name: waterDepthCm
          schema:
            type: number
          description: Single depth lookup (fallback - for testing only)
      responses:
        '200':
          description: Per-zone recommendation (when districtId provided)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Per-zone response
                    properties:
                      districtId:
                        type: string
                      districtName:
                        type: string
                      zones:
                        type: array
                        items:
                          type: object
                          properties:
                            zone:
                              type: string
                            waterDepthCm:
                              type: number
                            deliveryMode:
                              type: string
                              enum: [MOTORBIKE, BICYCLE_OR_FOOT, BOAT, SUSPENDED]
                            active:
                              type: boolean
                            warning:
                              type: string
                  - type: object
                    description: Single-depth response
                    properties:
                      waterDepthCm:
                        type: number
                      deliveryMode:
                        type: string
                        enum: [MOTORBIKE, BICYCLE_OR_FOOT, BOAT, SUSPENDED]
                      warning:
                        type: string

  /api/route/update:
    post:
      tags: [Routing]
      summary: Update water depth for a zone (creates route log entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [districtId, zone, waterDepthCm]
              properties:
                districtId: { type: string }
                zone: { type: string }
                waterDepthCm: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Route updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  route: { $ref: '#/components/schemas/RouteStatus' }
                  deliveryMode: { type: string }
                  warning: { type: string, nullable: true }
        "401":
          description: Unauthorized

  /api/route/logs:
    get:
      tags: [Routing]
      summary: Route status change history
      parameters:
        - in: query
          name: districtId
          schema: { type: string }
      responses:
        "200":
          description: Route change log history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    createdAt: { type: string, format: date-time }
                    previousDepth: { type: integer }
                    newDepth: { type: integer }
                    newMode: { type: string }
        "401":
          description: Unauthorized

  /api/route/district/{districtId}:
    get:
      tags: [Routing]
      summary: Current active routes for a district
      parameters:
        - in: path
          name: districtId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active routes for district
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteStatus' }
        "401":
          description: Unauthorized


  # ── VOLUNTEERS ──────────────────────────────────────────────────────────────
  /api/volunteers:
    get:
      tags: [Volunteers]
      summary: List all volunteers (filter by district or status)
      description: |
        Returns all volunteers. Filter by district for Hub Manager views.
        Section D.6: 12 volunteers per sub-warehouse = 36 minimum across 3 districts.
      parameters:
        - in: query
          name: districtId
          schema: { type: string }
          description: Filter by district ID
        - in: query
          name: status
          schema: { type: string, enum: [AVAILABLE, DEPLOYED, INACTIVE] }
          description: Filter by deployment status
      responses:
        "200":
          description: Volunteer list
        "401":
          description: Unauthorized

    post:
      tags: [Volunteers]
      summary: Add volunteer to roster — Hub Manager or above
      description: |
        Adds a new volunteer to a district roster.
        Section D.6: Red Cross maintains active roster with 20% buffer (45 names total)
        to account for unavailability during flood events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [districtId, name, phone]
              properties:
                districtId: { type: string }
                name: { type: string, example: "Nguyen Van A" }
                phone: { type: string, example: "+84901234567" }
                role:
                  type: string
                  enum: [TEAM_LEADER, VOLUNTEER]
                  default: VOLUNTEER
              examples:
                teamLeader:
                  summary: Add a new Team Leader
                  value: { districtId: "REPLACE_WITH_DISTRICT_ID", name: "Nguyen Van A", phone: "+84901234567", role: "TEAM_LEADER" }
                volunteer:
                  summary: Add a general volunteer
                  value: { districtId: "REPLACE_WITH_DISTRICT_ID", name: "Tran Thi B", phone: "+84907654321", role: "VOLUNTEER" }
      responses:
        "201":
          description: Volunteer added to roster
        "400":
          description: Validation error or district not found
        "401":
          description: Unauthorized
        "403":
          description: Requires HUB_MANAGER or above

  /api/volunteers/assign:
    post:
      tags: [Volunteers]
      summary: Assign volunteer to zone and team — Hub Manager or above
      description: |
        Assigns a volunteer to a specific zone and team for an active flood alert.
        Also marks the volunteer as DEPLOYED.
        Section B.4: 3 teams of 4 volunteers per sub-warehouse.
        Section C.7 fairness: cross-ward assignment (volunteers assess wards they are NOT from).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volunteerId, subWarehouseId, alertId, zone, teamNumber]
              properties:
                volunteerId: { type: string }
                subWarehouseId: { type: string }
                alertId:
                  type: string
                  description: "Get from GET /api/alert/status — the active alert ID"
                zone:
                  type: string
                  example: "Zone A"
                teamNumber:
                  type: integer
                  enum: [1, 2, 3]
              examples:
                assignTeamLeader:
                  summary: Assign Team Leader to Zone A, Team 1
                  value:
                    volunteerId: "REPLACE_WITH_VOLUNTEER_ID"
                    subWarehouseId: "REPLACE_WITH_SW_ID"
                    alertId: "REPLACE_WITH_ALERT_ID"
                    zone: "Zone A"
                    teamNumber: 1
      responses:
        "201":
          description: Volunteer assigned and marked DEPLOYED
        "400":
          description: Invalid teamNumber, volunteer/sub-warehouse/alert not found
        "401":
          description: Unauthorized
        "403":
          description: Requires HUB_MANAGER or above

  /api/volunteers/{districtId}/roster:
    get:
      tags: [Volunteers]
      summary: Full roster for a district with minimum check
      description: |
        Returns all volunteers in a district, grouped with minimum threshold check.
        Section D.6: 12 volunteers per district is the minimum viable number.
        Warning returned if below threshold.
      parameters:
        - in: path
          name: districtId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: District roster with summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  districtId: { type: string }
                  districtName: { type: string }
                  total: { type: integer }
                  teamLeaders: { type: integer }
                  generalVolunteers: { type: integer }
                  belowMinimum: { type: boolean }
                  minimumWarning: { type: string, nullable: true }
                  volunteers: { type: array, items: { type: object } }
        "404":
          description: District not found
        "401":
          description: Unauthorized

  /api/volunteers/{id}:
    patch:
      tags: [Volunteers]
      summary: Update volunteer info or status — Hub Manager or above
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                status: { type: string, enum: [AVAILABLE, DEPLOYED, INACTIVE] }
                role: { type: string, enum: [TEAM_LEADER, VOLUNTEER] }
              examples:
                markAvailable:
                  summary: Mark volunteer as available after flood ends
                  value: { status: "AVAILABLE" }
                markInactive:
                  summary: Remove volunteer from active rotation
                  value: { status: "INACTIVE" }
      responses:
        "200":
          description: Volunteer updated
        "400":
          description: Volunteer not found
        "401":
          description: Unauthorized
        "403":
          description: Requires HUB_MANAGER or above


  # ── INCIDENTS ───────────────────────────────────────────────────────────────
  /api/incidents:
    post:
      tags: [Incidents]
      summary: Report an incident
      description: |
        Report any operational incident during flood response.
        VOLUNTEER_SAFETY incidents are automatically escalated (Section A.4 hard constraint).
        Types map directly to Section B.6 contingency levels and Section A.4 safety rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [districtId, type, description]
              properties:
                districtId: { type: string }
                type:
                  type: string
                  enum: [ROUTE_BLOCKED, VOLUNTEER_SAFETY, STOCK_SCARCITY, BUILDING_FLOODED, OTHER]
                description: { type: string }
              examples:
                routeBlocked:
                  summary: "Section B.6 Level 1 — single route blocked"
                  value:
                    districtId: "REPLACE_WITH_DISTRICT_ID"
                    type: "ROUTE_BLOCKED"
                    description: "Nguyen Hue Street flooded — cannot reach Zone B households by motorbike. Switching to bicycle."
                volunteerSafety:
                  summary: "Section A.4 — volunteer safety (auto-escalated)"
                  value:
                    districtId: "REPLACE_WITH_DISTRICT_ID"
                    type: "VOLUNTEER_SAFETY"
                    description: "Water depth now 85cm in Zone C — Team 2 returning to sub-warehouse. Escalating to civil defense."
                buildingFlooded:
                  summary: "Section B.6 Level 3 — sub-warehouse at risk"
                  value:
                    districtId: "REPLACE_WITH_DISTRICT_ID"
                    type: "BUILDING_FLOODED"
                    description: "Ward office floor showing water ingress. Activating backup location at District 1 School."
      responses:
        "201":
          description: Incident reported (VOLUNTEER_SAFETY auto-escalated to ESCALATED status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        "400":
          description: Invalid type or district not found
        "401":
          description: Unauthorized

    get:
      tags: [Incidents]
      summary: List incidents with optional filters
      parameters:
        - in: query
          name: districtId
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [ROUTE_BLOCKED, VOLUNTEER_SAFETY, STOCK_SCARCITY, BUILDING_FLOODED, OTHER] }
        - in: query
          name: status
          schema: { type: string, enum: [OPEN, ESCALATED, RESOLVED] }
      responses:
        "200":
          description: Incident list (ESCALATED sorted first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        "401":
          description: Unauthorized

  /api/incidents/{id}/resolve:
    patch:
      tags: [Incidents]
      summary: Mark incident resolved
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident resolved with resolver and timestamp recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        "400":
          description: Incident already resolved or not found
        "401":
          description: Unauthorized


  # ── RADIO CHECK-INS ─────────────────────────────────────────────────────────
  /api/radio/checkin:
    post:
      tags: [Radio]
      summary: Submit scheduled radio check-in
      description: |
        Fixed schedule: T0800, T1200, T1600, T2000 (Section D.9).
        Hub Managers report to Operations Center at each scheduled time:
        - T0800: stock levels, overnight incidents, morning plan
        - T1200: delivery progress, new critical cases, route issues
        - T1600: afternoon delivery summary, resupply needs
        - T2000: end-of-day stock count, next-day plan

        If internet/phone fails, check-ins are submitted retroactively when contact restored.
        Section D.9: If digital fails, paper forms physically transported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [districtId, scheduledTime, status]
              properties:
                districtId: { type: string }
                scheduledTime: { type: string, enum: [T0800, T1200, T1600, T2000] }
                status: { type: string, enum: [OK, ISSUE_REPORTED] }
                notes: { type: string, description: "Required if status is ISSUE_REPORTED" }
              examples:
                morning_ok:
                  summary: "08:00 check-in — all OK"
                  value:
                    districtId: "REPLACE_WITH_DISTRICT_ID"
                    scheduledTime: "T0800"
                    status: "OK"
                    notes: "EMK1: 4,800 remaining. 3 delivery teams deployed. No overnight incidents."
                noon_issue:
                  summary: "12:00 check-in — issue reported"
                  value:
                    districtId: "REPLACE_WITH_DISTRICT_ID"
                    scheduledTime: "T1200"
                    status: "ISSUE_REPORTED"
                    notes: "Zone B route blocked by debris. EMK2 supply at 35%. Requesting boat reallocation."
      responses:
        "201":
          description: Check-in recorded
        "400":
          description: Invalid scheduledTime, status, or district not found
        "401":
          description: Unauthorized

  /api/radio/checkins:
    get:
      tags: [Radio]
      summary: List check-ins (filter by district and date)
      parameters:
        - in: query
          name: districtId
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
          description: "ISO date e.g. 2026-04-21 — returns all check-ins for that calendar day"
      responses:
        "200":
          description: Check-in list newest first
        "401":
          description: Unauthorized

  /api/radio/compliance:
    get:
      tags: [Radio]
      summary: Today's check-in compliance summary across all districts
      description: |
        Shows which districts have submitted each of the 4 scheduled check-ins today.
        Highlights missing check-ins — critical for Operations Center situational awareness.
      responses:
        "200":
          description: Compliance summary per district
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    districtId: { type: string }
                    districtName: { type: string }
                    completedSlots: { type: array, items: { type: string } }
                    missingSlots: { type: array, items: { type: string } }
                    issuesReported: { type: boolean }
                    compliance: { type: string, example: "3/4" }
        "401":
          description: Unauthorized


  # ── NOTIFICATIONS ───────────────────────────────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get all notifications for current user
      responses:
        "200":
          description: Notification list newest first
        "401":
          description: Unauthorized

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        "401":
          description: Unauthorized

  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notification marked as read
        "400":
          description: Notification not found or belongs to another user
        "401":
          description: Unauthorized

  # ── DASHBOARD ────────────────────────────────────────────────────────────────
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Full operations dashboard — phase + households + stock + incidents + radio
      description: |
        Aggregated data for the V1 Operations Dashboard.
        Returns everything needed in a single call:
        - Current phase and activation state
        - Household band counts (undelivered)
        - Per-district stock levels with scarcity flags
        - Open/escalated incidents (top 10)
        - Active delivery run count
        - Today's radio check-in count
      responses:
        "200":
          description: Full dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        "401":
          description: Unauthorized

  /api/dashboard/district/{id}:
    get:
      tags: [Dashboard]
      summary: Per-district summary card with radio check-ins
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: District dashboard card with recent radio check-ins
        "404":
          description: District not found
        "401":
          description: Unauthorized