openapi: "3.0.3"
info:
  title: REMA API — Rapid Emergency Medical Access
  description: |
    Backend API for the REMA humanitarian logistics system.
    Built for the Viet Nam Red Cross Medical Logistics challenge (University Track).

    **Architecture:** 3-layer — Central Warehouse → Sub-Warehouses (×3) → Last-Mile Delivery

    **Response window:** 24–48 hours during flood events

    **Authentication:** JWT Bearer token (add via Authorize button above)

    **Test accounts (all passwords: rema1234):**
    - admin@rema.vn — SUPER_ADMIN
    - coordinator@rema.vn — EMERGENCY_COORDINATOR
    - hub1@rema.vn — HUB_MANAGER (District 1)
    - hub2@rema.vn — HUB_MANAGER (District 2)
    - hub3@rema.vn — HUB_MANAGER (District 3)
    - volunteer1@rema.vn — VOLUNTEER (District 1)
    - viewer@rema.vn — VIEWER
  version: "1.0.0"
  contact:
    name: REMA Project

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://rema-medical-logistics.onrender.com
    description: Production (Render)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── System ────────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        system:
          type: string
          example: REMA — Rapid Emergency Medical Access
        version:
          type: string
          example: 1.0.0
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: coordinator@rema.vn
        password:
          type: string
          example: rema1234

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, EMERGENCY_COORDINATOR, HUB_MANAGER, VOLUNTEER, VIEWER]
        districtId:
          type: string
          nullable: true

    UserDetail:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [SUPER_ADMIN, EMERGENCY_COORDINATOR, HUB_MANAGER, VOLUNTEER, VIEWER]
        districtId: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        district:
          type: object
          nullable: true
          properties:
            name: { type: string }
 
    CreateUserRequest:
      type: object
      required: [email, name, role, temporaryPassword]
      properties:
        email:
          type: string
          format: email
          example: hub4@rema.vn
        name:
          type: string
          example: Hub Manager District 4
        role:
          type: string
          enum: [EMERGENCY_COORDINATOR, HUB_MANAGER, VOLUNTEER, VIEWER]
          description: "SUPER_ADMIN cannot be created via API — seed script only"
        districtId:
          type: string
          nullable: true
          description: "Required for HUB_MANAGER and VOLUNTEER roles"
        temporaryPassword:
          type: string
          minLength: 8
          example: TempPass2026!
          description: "User must change this on first login"
 
    PublicStatus:
      type: object
      properties:
        system: { type: string }
        operatedBy: { type: string }
        status:
          type: string
          enum: [ACTIVE, STANDBY]
        phase: { type: integer, enum: [0, 1, 2] }
        phaseDescription: { type: string }
        activatedAt: { type: string, format: date-time, nullable: true }
        activeDistricts: { type: integer }
        totalDistricts: { type: integer }
        activeDeliveryTeams: { type: integer }
        householdsServed: { type: integer }
        lastUpdated: { type: string, format: date-time }


    # ── Flood Alert ───────────────────────────────────────────────────────────
    FloodAlertStatus:
      type: object
      properties:
        id:
          type: string
        warningLevelTwo:
          type: boolean
        rainfallExceeds100mm:
          type: boolean
        streetFloodingReport:
          type: boolean
        activated:
          type: boolean
        activatedAt:
          type: string
          format: date-time
          nullable: true
        phase:
          type: integer
          enum: [0, 1, 2]
          description: "0=standby, 1=active (Hours 0–24), 2=last-mile (Hours 24–48)"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TriggerRequest:
      type: object
      required: [condition]
      properties:
        condition:
          type: string
          enum: [warningLevelTwo, rainfallExceeds100mm, streetFloodingReport]

    # ── Scoring ───────────────────────────────────────────────────────────────
    HouseholdScore:
      type: object
      required: [cat1, cat2, cat3, cat4, cat5]
      properties:
        cat1:
          type: integer
          description: "Medical urgency: 0, 2, 5, or 8"
          enum: [0, 2, 5, 8]
        cat2:
          type: integer
          minimum: 0
          maximum: 5
          description: "Household vulnerability: sum of flags, capped at 5"
        cat3:
          type: integer
          description: "Flood exposure: 0, 1, 3, or 4"
          enum: [0, 1, 3, 4]
        cat4:
          type: integer
          minimum: 0
          maximum: 2
          description: "Self-sufficiency: 0, 1, or 2"
        cat5:
          type: integer
          minimum: 0
          maximum: 1
          description: "Isolation: 0 or 1"

    ScoreResult:
      type: object
      properties:
        cat1:
          type: integer
        cat2:
          type: integer
        cat3:
          type: integer
        cat4:
          type: integer
        cat5:
          type: integer
        totalScore:
          type: integer
          minimum: 0
          maximum: 20
        priorityBand:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, STANDARD]
        recommendedEmk:
          type: string
          enum: [EMK1, EMK2, EMK3]

    # ── Households ────────────────────────────────────────────────────────────
    HouseholdDetail:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
        districtId:
          type: string
        district:
          type: object
          properties:
            name:
              type: string
        medicalUrgencyScore:
          type: integer
        vulnerabilityScore:
          type: integer
        floodExposureScore:
          type: integer
        selfSufficiencyScore:
          type: integer
        isolationScore:
          type: integer
        totalScore:
          type: integer
        priorityBand:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, STANDARD]
        recommendedEmk:
          type: string
          enum: [EMK1, EMK2, EMK3]
        delivered:
          type: boolean
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Stock ─────────────────────────────────────────────────────────────────
    StockLevel:
      type: object
      properties:
        subWarehouseId:
          type: string
        districtId:
          type: string
        districtName:
          type: string
        emk1Total:
          type: integer
        emk1Remaining:
          type: integer
        emk1Pct:
          type: integer
          description: "% remaining (0–100)"
        emk1Scarce:
          type: boolean
          description: "True when EMK1 remaining < 30% of total (Section C.9)"
        emk2Total:
          type: integer
        emk2Remaining:
          type: integer
        emk2Pct:
          type: integer
        emk2Scarce:
          type: boolean
        emk3Total:
          type: integer
          description: "0 until MoH transfer at flood activation (Section B.10)"
        emk3Remaining:
          type: integer
        emk3Pct:
          type: integer
        emk3Scarce:
          type: boolean
        anyScarce:
          type: boolean
          description: "True if ANY EMK type is below 30% scarcity threshold"
        updatedAt:
          type: string
          format: date-time

    CentralStockLevel:
      type: object
      description: |
        Stock levels at the central warehouse.
        Total = cumulative stock ever received (increases only on replenishment).
        Remaining = current available to dispatch (decreases on dispatch, increases on replenishment).
        AboveAllocation flag is not applicable here — central warehouse has no fixed allocation cap.
      properties:
        id:
          type: string
        emk1Total:
          type: integer
          description: "Cumulative EMK-1 received at central warehouse"
        emk1Remaining:
          type: integer
          description: "EMK-1 available for dispatch"
        emk1Pct:
          type: integer
          description: "% remaining (capped at 100)"
        emk1Scarce:
          type: boolean
          description: "True when EMK-1 remaining < 30% of total"
        emk2Total:
          type: integer
        emk2Remaining:
          type: integer
        emk2Pct:
          type: integer
        emk2Scarce:
          type: boolean
        emk3Total:
          type: integer
          description: "0 until MoH transfer at flood activation (Section B.10)"
        emk3Remaining:
          type: integer
        emk3Pct:
          type: integer
        emk3Scarce:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    ReplenishCentralRequest:
      type: object
      required: [emkType, quantity, reason]
      properties:
        emkType:
          type: string
          enum: [EMK1, EMK2, EMK3]
        quantity:
          type: integer
          minimum: 1
          description: "Units of new stock arriving at central warehouse"
        reason:
          type: string
          description: "Mandatory — source of new stock (donor, MoH, etc.)"
          example: "UNICEF donation batch 3 — 1,000 EMK-1 kits"
 
    AdjustCentralRequest:
      type: object
      required: [emkType, quantity, reason]
      properties:
        emkType:
          type: string
          enum: [EMK1, EMK2, EMK3]
        quantity:
          type: integer
          description: "Signed — positive to add, negative to remove. Does NOT change Total."
          example: -10
        reason:
          type: string
          description: "Mandatory — reason for correction"
          example: "10 EMK-2 kits damaged by flood water in storage"
 
    ReplenishCentralResponse:
      type: object
      properties:
        emkType:
          type: string
          enum: [EMK1, EMK2, EMK3]
        quantity:
          type: integer
        reason:
          type: string
        updatedStock:
          type: object
          properties:
            emk1Total: { type: integer }
            emk1Remaining: { type: integer }
            emk2Total: { type: integer }
            emk2Remaining: { type: integer }
            emk3Total: { type: integer }
            emk3Remaining: { type: integer }

    SetAllocationRequest:
      type: object
      required: [target, emkType, newTotal, reason]
      properties:
        target:
          type: string
          enum: [central, subWarehouse]
          description: "Which warehouse to update allocation for"
        subWarehouseId:
          type: string
          description: "Required when target is 'subWarehouse'"
        emkType:
          type: string
          enum: [EMK1, EMK2, EMK3]
        newTotal:
          type: integer
          minimum: 0
          description: "The new Total allocation number. Does NOT change Remaining."
        reason:
          type: string
          description: "Mandatory — must justify the allocation change"
          example: "New donor agreement increases District 1 EMK1 allocation to 8,000"

    StockMovement:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        subWarehouseId:
          type: string
        subWarehouse:
          type: object
          properties:
            districtId:
              type: string
            district:
              type: object
              properties:
                name:
                  type: string
        emkType:
          type: string
          enum: [EMK1, EMK2, EMK3]
        movementType:
          type: string
          enum: [DISPATCH, DELIVERY, REALLOCATION, ADJUSTMENT, MOH_TRANSFER]
        quantity:
          type: integer
          description: "Positive = stock in, negative = stock out"
        reason:
          type: string
          nullable: true
        performedBy:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            role:
              type: string

    # ── Districts ─────────────────────────────────────────────────────────────
    DistrictCard:
      type: object
      properties:
        districtId:
          type: string
        name:
          type: string
        population:
          type: integer
        subWarehouseId:
          type: string
          nullable: true
        subWarehouseStatus:
          type: string
          nullable: true
          enum: [INACTIVE, ACTIVE, BACKUP_ACTIVATED]
        stockPct:
          type: number
          description: "Average remaining stock % across EMK types"
        stock:
          type: object
          nullable: true
          properties:
            emk1Total:
              type: integer
            emk1Remaining:
              type: integer
            emk2Total:
              type: integer
            emk2Remaining:
              type: integer
            emk3Total:
              type: integer
            emk3Remaining:
              type: integer
        householdsAssessed:
          type: integer
        deliveredCount:
          type: integer
        openIncidents:
          type: integer
        
    DeliveryRun:
      type: object
      properties:
        id: { type: string }
        subWarehouseId: { type: string }
        teamNumber: { type: integer }
        zone: { type: string }
        departedAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETE, ABORTED]
        subWarehouse:
          type: object
          properties:
            district: { type: object, properties: { name: { type: string } } }
        leadVolunteer:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
        receipts:
          type: array
          items: { $ref: '#/components/schemas/DeliveryReceipt' }

    DeliveryReceipt:
      type: object
      properties:
        id: { type: string }
        deliveryRunId: { type: string }
        householdId: { type: string }
        emkType: { type: string, enum: [EMK1, EMK2, EMK3] }
        quantity: { type: integer }
        deliveredAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        household:
          type: object
          nullable: true
          properties:
            address: { type: string }
            totalScore: { type: integer }
            priorityBand: { type: string }

    RouteStatus:
      type: object
      properties:
        id: { type: string }
        districtId: { type: string }
        zone: { type: string }
        waterDepthCm: { type: integer }
        deliveryMode:
          type: string
          enum: [MOTORBIKE, BICYCLE_OR_FOOT, BOAT, SUSPENDED]
        active: { type: boolean }
        district:
          type: object
          properties:
            name: { type: string }

    # ── Volunteers ────────────────────────────────────────────────────────────
    Volunteer:
      type: object
      properties:
        id: { type: string }
        districtId: { type: string }
        name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [TEAM_LEADER, VOLUNTEER] }
        status: { type: string, enum: [AVAILABLE, DEPLOYED, INACTIVE] }
        createdAt: { type: string, format: date-time }

    # ── Radio Check-ins ───────────────────────────────────────────────────────
    RadioCheckin:
      type: object
      properties:
        id: { type: string }
        districtId: { type: string }
        district: { type: object, properties: { name: { type: string } } }
        submittedBy: { type: object, properties: { name: { type: string }, role: { type: string } } }
        scheduledTime: { type: string, enum: [T0800, T1200, T1600, T2000] }
        status: { type: string, enum: [OK, ISSUE_REPORTED] }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── Dashboard (Updated) ───────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        phase: { type: integer }
        activated: { type: boolean }
        activatedAt: { type: string, nullable: true, format: date-time }
        triggerConditions:
          type: object
          nullable: true
          properties:
            warningLevelTwo: { type: boolean }
            rainfallExceeds100mm: { type: boolean }
            streetFloodingReport: { type: boolean }
        households:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            standard: { type: integer }
            delivered: { type: integer }
            total: { type: integer }
            pendingDelivery: { type: integer }
        activeDeliveryRuns: { type: integer }
        todayRadioCheckins: { type: integer }
        districts:
          type: array
          items: { $ref: '#/components/schemas/DistrictCard' }
        openIncidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }

    # ── Incidents ─────────────────────────────────────────────────────────────
    Incident:
      type: object
      properties:
        id:
          type: string
        districtId:
          type: string
        type:
          type: string
          enum: [ROUTE_BLOCKED, VOLUNTEER_SAFETY, STOCK_SCARCITY, BUILDING_FLOODED, OTHER]
        description:
          type: string
        status:
          type: string
          enum: [OPEN, ESCALATED, RESOLVED]
        createdAt:
          type: string
          format: date-time

    AiBriefResponse:
      type: object
      properties:
        summary:
          type: string
          description: 2–3 sentence situation overview covering delivery progress, stock status, and key risks
          example: "Phase 1 operations are underway with 3 active delivery runs across 3 districts. District 2 is approaching stock scarcity on EMK-1 with 28% remaining. 12 households remain in CRITICAL priority status requiring immediate delivery."
        priorityAlert:
          type: string
          description: The single most urgent issue the coordinator must address right now
          example: "District 2 EMK-1 stock is below the 30% scarcity threshold — reallocation from District 3 should be initiated before the next delivery run."
        nextStep:
          type: string
          description: One concrete action the coordinator should take in the next 60 minutes
          example: "Authorise a cross-district stock reallocation of 50 EMK-1 units from District 3 to District 2 via POST /api/stock/reallocate."
        generatedAt:
          type: string
          format: date-time
          description: ISO timestamp when the brief was generated
        dataSnapshot:
          $ref: '#/components/schemas/AiBriefDataSnapshot'
      required:
        - summary
        - priorityAlert
        - nextStep
        - generatedAt
        - dataSnapshot
 
    # AI
    AiBriefDataSnapshot:
      type: object
      description: The aggregate data used to generate the brief (no PII)
      properties:
        phase:
          type: integer
          example: 1
        totalCritical:
          type: integer
          example: 12
        totalHigh:
          type: integer
          example: 34
        totalMedium:
          type: integer
          example: 67
        totalStandard:
          type: integer
          example: 120
        scarcityActive:
          type: boolean
          example: true
        activeDeliveryRuns:
          type: integer
          example: 3
        openIncidentCount:
          type: integer
          example: 2
        radioCompliancePct:
          type: integer
          example: 75
 
    AiBriefError:
      type: object
      properties:
        error:
          type: string
          example: "AI Brief temporarily unavailable"
        detail:
          type: string
          example: "AI Brief unavailable: Anthropic API call failed"


security:
  - bearerAuth: []

paths:

  # ── HEALTH ──────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [System]
      summary: Health check
      description: Returns system status. No authentication required.
      security: []
      responses:
        "200":
          description: System is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── PUBLIC STATUS (no auth) ─────────────────────────────────────────────────
  /api/status:
    get:
      tags: [System]
      summary: Public system status — no authentication required
      description: |
        Returns non-sensitive aggregate data about REMA's current operational state.
        Safe to expose publicly: phase, activation state, district count, delivery counts.
        
        **Never exposes:** household addresses, medical information, vulnerability scores,
        user accounts, or any personally identifiable information.
        
        Intended for: Ministry of Health liaison, district civil defense observer,
        IFRC monitoring officer, or a public status page.
      security: []
      responses:
        "200":
          description: Current system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'

  # ── AI 
  /api/ai/brief:
    post:
      summary: Generate AI operational brief
      description: >
        Reads current aggregate dashboard state (no PII) and calls the Anthropic
        Claude API server-side to produce a 3-part operational brief.
        **Advisory only** — cannot trigger any system action.
        Requires EMERGENCY_COORDINATOR or SUPER_ADMIN role.
      tags:
        - AI
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI brief generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiBriefResponse'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role (requires EMERGENCY_COORDINATOR or above)
        '503':
          description: AI Brief temporarily unavailable (Anthropic API error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiBriefError'


  # ── AUTH TESTS ───────────────────────────────────────────────────────────────
  /api/test/viewer:
    get:
      tags: [Auth Tests]
      summary: "Test: requires any valid token"
      description: "Should return 401 without token. Any role passes."
      responses:
        "200":
          description: Access granted
        "401":
          description: No token

  /api/test/hub-manager:
    get:
      tags: [Auth Tests]
      summary: "Test: requires HUB_MANAGER or above"
      description: "VIEWER and VOLUNTEER get 403. HUB_MANAGER, EMERGENCY_COORDINATOR, SUPER_ADMIN pass."
      responses:
        "200":
          description: Access granted
        "401":
          description: No token
        "403":
          description: Insufficient role

  /api/test/coordinator:
    get:
      tags: [Auth Tests]
      summary: "Test: requires EMERGENCY_COORDINATOR or above"
      description: "Only EMERGENCY_COORDINATOR and SUPER_ADMIN pass."
      responses:
        "200":
          description: Access granted
        "401":
          description: No token
        "403":
          description: Insufficient role

  /api/test/admin:
    get:
      tags: [Auth Tests]
      summary: "Test: requires SUPER_ADMIN only"
      description: "Only SUPER_ADMIN passes."
      responses:
        "200":
          description: Access granted
        "401":
          description: No token
        "403":
          description: Insufficient role

  # ── AUTH ────────────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticate with email and password. Returns a JWT token valid for 12 hours.

        **Test accounts (all passwords: rema1234):**
        - admin@rema.vn — SUPER_ADMIN
        - coordinator@rema.vn — EMERGENCY_COORDINATOR
        - hub1@rema.vn — HUB_MANAGER (District 1)
        - hub2@rema.vn — HUB_MANAGER (District 2)
        - hub3@rema.vn — HUB_MANAGER (District 3)
        - volunteer1@rema.vn — VOLUNTEER (District 1)
        - viewer@rema.vn — VIEWER
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              coordinator:
                summary: Login as Emergency Coordinator
                value: { email: "coordinator@rema.vn", password: "rema1234" }
              hubManager:
                summary: Login as Hub Manager District 1
                value: { email: "hub1@rema.vn", password: "rema1234" }
              volunteer:
                summary: Login as Volunteer
                value: { email: "volunteer1@rema.vn", password: "rema1234" }
              viewer:
                summary: Login as Viewer (read-only)
                value: { email: "viewer@rema.vn", password: "rema1234" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: JWT is stateless — delete the token client-side. This endpoint confirms the action.
      responses:
        "200":
          description: Logged out successfully

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          description: Unauthorized

  # ── USER MANAGEMENT ─────────────────────────────────────────────────────────
  /api/users:
    get:
      tags: [User Management]
      summary: List all system users — SUPER_ADMIN only
      description: |
        Returns all user accounts. Never returns passwordHash.
        
        Filter by role, district, or active status.
        Use this to audit who has access to the system.
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [SUPER_ADMIN, EMERGENCY_COORDINATOR, HUB_MANAGER, VOLUNTEER, VIEWER]
        - in: query
          name: districtId
          schema: { type: string }
        - in: query
          name: active
          schema: { type: boolean }
          description: "Filter by active status — use false to list deactivated accounts"
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDetail'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN
 
    post:
      tags: [User Management]
      summary: Create a new user account — SUPER_ADMIN only
      description: |
        Creates a new system user with a temporary password.
        
        **SUPER_ADMIN accounts cannot be created via API** — only via the seed script.
        This is a deliberate security decision.
        
        **Role → district rules:**
        - HUB_MANAGER: districtId required (one Hub Manager per district)
        - VOLUNTEER: districtId required
        - EMERGENCY_COORDINATOR: districtId optional (usually null — covers all districts)
        - VIEWER: districtId optional
        
        After creation, share the temporary password with the user via a secure channel.
        The user should change it on first login via PATCH /api/users/me/password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              hubManager:
                summary: Create Hub Manager for District 2
                value:
                  email: hub2-new@rema.vn
                  name: Nguyen Van Hub
                  role: HUB_MANAGER
                  districtId: "REPLACE_WITH_DISTRICT_ID"
                  temporaryPassword: TempPass2026!
              coordinator:
                summary: Create Emergency Coordinator (no district)
                value:
                  email: coordinator2@rema.vn
                  name: Tran Thi Coordinator
                  role: EMERGENCY_COORDINATOR
                  temporaryPassword: TempPass2026!
              viewer:
                summary: Create read-only observer (MoH liaison)
                value:
                  email: moh.liaison@health.gov.vn
                  name: MoH Liaison Observer
                  role: VIEWER
                  temporaryPassword: TempPass2026!
      responses:
        "201":
          description: User created with mustChangePassword flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserDetail'
                  - type: object
                    properties:
                      mustChangePassword:
                        type: boolean
                        example: true
        "400":
          description: Validation error (email in use, invalid role, missing districtId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN
 
  /api/users/me/password:
    patch:
      tags: [User Management]
      summary: Change own password — any authenticated user
      description: |
        Any logged-in user can change their own password.
        Must provide current password to confirm identity.
        New password must be at least 8 characters and different from current.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: rema1234
                newPassword:
                  type: string
                  minLength: 8
                  example: NewSecurePass2026!
            examples:
              changePassword:
                summary: Change password after receiving temporary one
                value:
                  currentPassword: TempPass2026!
                  newPassword: MySecurePassword2026!
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Wrong current password, too short, or same as current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
 
  /api/users/{id}:
    get:
      tags: [User Management]
      summary: Get single user — SUPER_ADMIN only
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        "404":
          description: User not found
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN
 
    patch:
      tags: [User Management]
      summary: Update user info, role, or active status — SUPER_ADMIN only
      description: |
        Update any field on a user account.
        
        **Constraints:**
        - Cannot change any field on a SUPER_ADMIN account
        - Cannot assign SUPER_ADMIN role
        - Cannot deactivate your own account
        - Email must be unique if changed
        
        **Deactivating a user** (active: false) prevents login but preserves all their data
        and audit trail records. This is the correct approach for staff who leave — 
        never delete users.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [EMERGENCY_COORDINATOR, HUB_MANAGER, VOLUNTEER, VIEWER]
                districtId: { type: string, nullable: true }
                active: { type: boolean }
            examples:
              deactivate:
                summary: Deactivate a user who has left the organisation
                value: { active: false }
              reactivate:
                summary: Reactivate a returning volunteer
                value: { active: true }
              changeDistrict:
                summary: Reassign Hub Manager to different district
                value:
                  districtId: "REPLACE_WITH_NEW_DISTRICT_ID"
              changeRole:
                summary: Promote Volunteer to Hub Manager
                value:
                  role: HUB_MANAGER
                  districtId: "REPLACE_WITH_DISTRICT_ID"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN
 
  /api/users/{id}/reset-password:
    post:
      tags: [User Management]
      summary: Reset any user's password — SUPER_ADMIN only
      description: |
        Admin override — sets a new temporary password without needing to know
        the current password. Use when a user is locked out or has forgotten their password.
        
        Cannot reset a SUPER_ADMIN password via API.
        
        After reset, share the temporary password securely and ask the user
        to change it immediately via PATCH /api/users/me/password.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temporaryPassword]
              properties:
                temporaryPassword:
                  type: string
                  minLength: 8
                  example: ResetPass2026!
      responses:
        "200":
          description: Password reset — user must change on next login
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userId: { type: string }
                  email: { type: string }
                  mustChangePassword: { type: boolean }
        "400":
          description: User not found, or attempting to reset SUPER_ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN

  # ── FLOOD ALERT ─────────────────────────────────────────────────────────────
  /api/alert/trigger:
    post:
      tags: [Flood Alert]
      summary: Submit a trigger condition (auto-activates at 2 of 3)
      description: |
        Submit one of the 3 trigger conditions. REMA auto-activates when 2 of 3 are true.
        Conditions are additive — once set true they stay true for the alert lifetime.

        **Trigger conditions (Section A.3):**
        - `warningLevelTwo` — City/provincial flood warning Level 2+
        - `rainfallExceeds100mm` — Rainfall forecast exceeds 100mm in 24 hours
        - `streetFloodingReport` — Any target district reports street-level flooding

        **Auto-activation:** When 2 conditions are met, `activated` becomes `true`
        and `phase` advances to `1` automatically.

        **Test sequence:**
        1. Submit `warningLevelTwo` → 1 condition set, not yet activated
        2. Submit `rainfallExceeds100mm` → 2 conditions met → activated=true, phase=1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRequest'
            examples:
              warningLevel:
                summary: "Step 1 — Submit flood warning Level 2"
                value: { condition: "warningLevelTwo" }
              rainfall:
                summary: "Step 2 — Submit rainfall threshold (triggers activation)"
                value: { condition: "rainfallExceeds100mm" }
              streetFlooding:
                summary: "Alternative — Submit street flooding report"
                value: { condition: "streetFloodingReport" }
      responses:
        "200":
          description: Trigger recorded; returns updated alert state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodAlertStatus'
        "400":
          description: Invalid condition name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

  /api/alert/status:
    get:
      tags: [Flood Alert]
      summary: Get current activation state and phase
      description: Returns the current FloodAlert record including which conditions are set and current phase.
      responses:
        "200":
          description: Current alert status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodAlertStatus'
        "401":
          description: Unauthorized

  /api/alert/phase:
    patch:
      tags: [Flood Alert]
      summary: Advance phase — Emergency Coordinator only
      description: |
        Advance phase 0→1→2. Requires EMERGENCY_COORDINATOR role or above.

        - Phase 1 = Hours 0–24 (protocol-driven pre-positioning)
        - Phase 2 = Hours 24–48 (adaptive last-mile delivery)

        Rules:
        - REMA must be activated before phase can be advanced
        - Phase can only go forward by 1 step at a time
        - Maximum phase is 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  type: integer
                  enum: [1, 2]
                  description: "Target phase — must equal current phase + 1"
            examples:
              toPhase1:
                summary: Advance to Phase 1
                value: { phase: 1 }
              toPhase2:
                summary: Advance to Phase 2
                value: { phase: 2 }
      responses:
        "200":
          description: Phase updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodAlertStatus'
        "400":
          description: Invalid phase transition or REMA not activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "403":
          description: Requires EMERGENCY_COORDINATOR or above

  /api/alert/reset:
    post:
      tags: [Flood Alert]
      summary: Reset system to Phase 0 standby — SUPER_ADMIN only
      description: |
        Resets all trigger conditions, deactivates REMA, and returns phase to 0.
        Does NOT delete the flood_alerts record — all history is preserved.
        Use this after a drill or to restart the activation sequence.
        **SUPER_ADMIN only.**
      responses:
        "200":
          description: System reset to Phase 0 standby
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodAlertStatus'
        "401":
          description: Unauthorized
        "403":
          description: Requires SUPER_ADMIN
          
  # ── SCORING ENGINE ───────────────────────────────────────────────────────────
  /api/score/household:
    post:
      tags: [Scoring]
      summary: Score a household — 20-point engine (no DB write)
      description: |
        Applies the exact 5-category scoring system from Section C of the REMA strategy.
        This endpoint scores only — it does NOT create a household record.
        Use POST /api/households to create and score simultaneously.

        **Category breakdown:**
        | Cat | Description | Valid values | Max pts |
        |-----|-------------|-------------|---------|
        | cat1 | Medical urgency | 0, 2, 5, or 8 | 8 |
        | cat2 | Household vulnerability | 0–5 (sum of flags, capped) | 5 |
        | cat3 | Flood exposure | 0, 1, 3, or 4 | 4 |
        | cat4 | Self-sufficiency | 0, 1, or 2 | 2 |
        | cat5 | Isolation | 0 or 1 | 1 |

        **cat1 values:**
        - 8 = life-sustaining medication run out or <24h remaining
        - 5 = chronic illness medication low (1–2 days remaining)
        - 2 = chronic illness, medication currently adequate
        - 0 = no chronic illness

        **cat3 values:**
        - 4 = water inside household or structurally unsafe
        - 3 = water at doorstep (within 10cm of entrance)
        - 1 = water in street but not reaching household
        - 0 = dry and elevated

        **Score bands:**
        - 15–20 = CRITICAL (deliver in current run)
        - 10–14 = HIGH (deliver same day)
        - 5–9 = MEDIUM (deliver within 48h)
        - 0–4 = STANDARD (community collection point)

        **EMK recommendation:**
        - cat1 ≥ 5 → EMK3 (life-sustaining medication needed)
        - cat2 ≥ 1 → EMK2 (vulnerable household)
        - otherwise → EMK1 (general kit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdScore'
            examples:
              caseF_HIGH:
                summary: "Section C.8 Case F — elderly hypertension, medication low → HIGH, EMK3"
                value: { cat1: 5, cat2: 2, cat3: 1, cat4: 1, cat5: 1 }
              caseC_MEDIUM_EMK3:
                summary: "Section C.8 Case C — diabetic, insulin run out → MEDIUM, EMK3"
                value: { cat1: 8, cat2: 0, cat3: 1, cat4: 0, cat5: 0 }
              caseE_STANDARD:
                summary: "Section C.8 Case E — family, no illness, dry street → STANDARD, EMK1"
                value: { cat1: 0, cat2: 0, cat3: 0, cat4: 1, cat5: 0 }
              criticalCase:
                summary: "Critical — insulin run out + water inside + isolated → CRITICAL, EMK3"
                value: { cat1: 8, cat2: 2, cat3: 4, cat4: 2, cat5: 1 }
      responses:
        "200":
          description: Score result with band and EMK recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResult'
        "400":
          description: Invalid score input (wrong cat1 or cat3 values)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

  # ── HOUSEHOLDS ───────────────────────────────────────────────────────────────
  /api/households/priority-queue:
    get:
      tags: [Households]
      summary: Sorted delivery priority list for a district
      description: |
        Returns all undelivered households sorted by delivery priority.

        **Sort order (Section C tiebreakers):**
        1. Band — CRITICAL first, then HIGH, MEDIUM, STANDARD
        2. Total score descending within each band
        3. cat1 (medical urgency) descending — tiebreaker rule 1
        4. createdAt ascending — first assessment submitted wins (tiebreaker rule 3)
      parameters:
        - in: query
          name: districtId
          required: true
          schema:
            type: string
          description: District ID to get queue for
      responses:
        "200":
          description: Prioritized household list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdDetail'
        "400":
          description: districtId query parameter is required
        "401":
          description: Unauthorized

  /api/households:
    get:
      tags: [Households]
      summary: List households with optional filters
      parameters:
        - in: query
          name: districtId
          schema:
            type: string
          description: Filter by district
        - in: query
          name: band
          schema:
            type: string
            enum: [CRITICAL, HIGH, MEDIUM, STANDARD]
          description: Filter by priority band
        - in: query
          name: delivered
          schema:
            type: boolean
          description: Filter by delivery status
      responses:
        "200":
          description: List of households
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdDetail'
        "401":
          description: Unauthorized

    post:
      tags: [Households]
      summary: Create household record (scores automatically)
      description: |
        Creates a household, runs the scoring engine, and stores the result.
        Also creates an assessment record in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, districtId, cat1, cat2, cat3, cat4, cat5]
              properties:
                address:
                  type: string
                  example: "45 Le Loi Street, Ward 3"
                districtId:
                  type: string
                cat1:
                  type: integer
                  enum: [0, 2, 5, 8]
                cat2:
                  type: integer
                  minimum: 0
                  maximum: 5
                cat3:
                  type: integer
                  enum: [0, 1, 3, 4]
                cat4:
                  type: integer
                  minimum: 0
                  maximum: 2
                cat5:
                  type: integer
                  minimum: 0
                  maximum: 1
                notes:
                  type: string
            examples:
              caseF:
                summary: "Case F equivalent — HIGH priority, EMK3"
                value:
                  address: "12 Tran Hung Dao, Ward 1"
                  districtId: "REPLACE_WITH_DISTRICT_ID"
                  cat1: 5
                  cat2: 2
                  cat3: 1
                  cat4: 1
                  cat5: 1
                  notes: "Elderly woman, 68, hypertension, medication running low"
      responses:
        "201":
          description: Household created and scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdDetail'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

  /api/households/{id}:
    get:
      tags: [Households]
      summary: Get single household with full history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Household detail with assessments and delivery receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdDetail'
        "404":
          description: Household not found
        "401":
          description: Unauthorized

    patch:
      tags: [Households]
      summary: Update household scores (triggers re-score)
      description: |
        Provide only the category scores you want to update.
        Omitted categories keep their existing values.
        A new assessment record is created in the audit trail.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cat1:
                  type: integer
                  enum: [0, 2, 5, 8]
                cat2:
                  type: integer
                  minimum: 0
                  maximum: 5
                cat3:
                  type: integer
                  enum: [0, 1, 3, 4]
                cat4:
                  type: integer
                  minimum: 0
                  maximum: 2
                cat5:
                  type: integer
                  minimum: 0
                  maximum: 1
                notes:
                  type: string
            examples:
              updateFloodExposure:
                summary: "Water has risen — update flood exposure only"
                value: { cat3: 4, notes: "Water now inside household" }
              updateMedication:
                summary: "Medication now run out — escalate urgency"
                value: { cat1: 8, notes: "Insulin supply exhausted" }
      responses:
        "200":
          description: Household updated and re-scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdDetail'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized

