services:
  - type: web
    name: rema-backend
    runtime: node
    rootDir: backend
    # migrate deploy applies any pending migrations (DIRECT_URL) before the new
    # code goes live; if it fails the build fails and the previous deploy keeps running
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard — Supabase connection string
      - key: DIRECT_URL
        sync: false   # Set in Render dashboard — Supabase direct connection
      - key: JWT_SECRET
        generateValue: true   # Render generates a secure random value
      - key: CORS_ORIGINS
        value: https://rema-system.vercel.app
      - key: PORT
        value: 3000
    healthCheckPath: /api/health
    autoDeploy: true